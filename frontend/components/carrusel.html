<!-- ═══════════════════════════════════════════════════════════════════════════
     CARRUSEL DE OFERTAS - MARAZUL E-COMMERCE
     ═══════════════════════════════════════════════════════════════════════════
     
     Diseño preservado del original:
     - 3 slides con imágenes hero (1200x400)
     - Captions con títulos y descripciones
     - Controles de navegación
     - Indicadores
     - Autoplay cada 5 segundos
     - Border-radius 12px
     - Responsive: altura 220px móvil, 320px tablet, 400px desktop
     ═══════════════════════════════════════════════════════════════════════════ -->

<section class="container my-4">
  
  <div id="carouselOfertas" 
       class="carousel slide carousel-fade" 
       data-bs-ride="carousel"
       data-bs-interval="5000">
    
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!-- INDICADORES -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <div class="carousel-indicators">
      <button type="button" 
              data-bs-target="#carouselOfertas" 
              data-bs-slide-to="0" 
              class="active" 
              aria-current="true" 
              aria-label="Slide 1">
      </button>
      <button type="button" 
              data-bs-target="#carouselOfertas" 
              data-bs-slide-to="1" 
              aria-label="Slide 2">
      </button>
      <button type="button" 
              data-bs-target="#carouselOfertas" 
              data-bs-slide-to="2" 
              aria-label="Slide 3">
      </button>
    </div>
    
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!-- SLIDES -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <div class="carousel-inner">
      
      <!-- SLIDE 1: Productos Frescos -->
      <div class="carousel-item active">
        <img src="https://res.cloudinary.com/dqms1jdlh/image/upload/v1764968744/BannerMarisco_bnwxbs.png" 
             class="d-block w-100" 
             alt="">
        <div class="carousel-caption d-none d-md-block rounded p-3">
          <h3 class="fw-bold"></h3>
          <p class="mb-2"></p>
          <a href="#mariscos" class="btn btn-light btn-sm">
            <i class="bi bi-eye me-2"></i>
            Ver Catálogo
          </a>
        </div>
      </div>
      
      <!-- SLIDE 2: Envíos -->
      <div class="carousel-item active">
        <img src="https://res.cloudinary.com/dqms1jdlh/image/upload/v1765056757/ABS2GSmGW8uB4rwjCTJFGrAPH6KBFmWtE1j_J1Ty_yOddmZL2cJQGeG6RymNQndViUfvH0SmccYJlqw-v3ouwqACxMG1bc1uzTNj6FdDTzajWcXkIYVxgVdq5fd032Xv5kwnGtyadAUQ3nmozWzAl4klJExgTl5IGwS57DW2L9241IulDNF5_ws1024-rj_xxj9ko.png" 
             class="d-block w-100" 
             alt="">
        <div class="carousel-caption d-none d-md-block rounded p-3">
          <h3 class="fw-bold"></h3>
          <p class="mb-2"></p>
          <a href="#pescados-fresco" class="btn btn-light btn-sm">
            <i class="bi bi-eye me-2"></i>
            Ver Catálogo
          </a>
        </div>
      </div>
      
      <!-- SLIDE 3: Variedad -->
      <div class="carousel-item active">
        <img src="https://res.cloudinary.com/dqms1jdlh/image/upload/v1765056757/ABS2GSny93144q55zCC04dYmggLvHFiyYVDViIagFqcT3OuoFAx-pmBqzesBGcCJJIyZ5u-UO8qYHH-91y8IhPJXuOEu7pD7ptuXOwWYeCNDXETl3gWHuppARUI38BQ7SmONeGW0ScROMV-6Ae73RWUIBQxYgsOw3qtJvNWENWj4T5ooKlhaows1024-rj_kweyu5.png" 
             class="d-block w-100" 
             alt="">
        <div class="carousel-caption d-none d-md-block rounded p-3">
          <h3 class="fw-bold"></h3>
          <p class="mb-2"></p>
          <a href="#ensalada" class="btn btn-light btn-sm">
            <i class="bi bi-eye me-2"></i>
            Ver Catálogo
          </a>
        </div>
      </div>
      
    </div>
    
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!-- CONTROLES DE NAVEGACIÓN -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <button class="carousel-control-prev" 
            type="button" 
            data-bs-target="#carouselOfertas" 
            data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    
    <button class="carousel-control-next" 
            type="button" 
            data-bs-target="#carouselOfertas" 
            data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
    
  </div>
  
</section>

<!-- ═══════════════════════════════════════════════════════════════════════════
     ESTILOS APLICADOS DESDE style.css:
     
     #carouselOfertas .carousel-item {
       height: 320px; (base)
     }
     
     #carouselOfertas img {
       height: 100%;
       object-fit: cover;
       border-radius: 12px;
     }
     
     @media (max-width: 768px) {
       #carouselOfertas .carousel-item {
         height: 220px;
       }
     }
     
     @media (min-width: 1200px) {
       #carouselOfertas .carousel-item {
         height: 400px;
       }
     }
     ═══════════════════════════════════════════════════════════════════════════ -->
