<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contáctanos - MarAzul</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  
  <!-- CSS Custom -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body style="background-color: #f8f9fa;">

  <!-- HEADER -->
  <div id="header-container"></div>

  <!-- CARRITO -->
  <div id="carrito-container"></div>

  <!-- CONTENIDO -->
  <main class="py-5">
    <div class="container">


      <div class="row">

        <!-- LISTA DE MENSAJES -->
        <div class="col-lg-6 col-md-12 mb-4">
          <div class="card shadow-sm border-0">
            <div class="card-header text-white" style="background-color:#003366;">
              <h5 class="mb-0"><i class="bi bi-chat-left-text me-2"></i>Mensajes Recibidos</h5>
            </div>

            <div class="card-body" id="messages-list" style="min-height: 300px;">
              <p class="text-muted">Cargando mensajes...</p>
            </div>
          </div>
        </div>

        <!-- DETALLES DEL MENSAJE -->
        <div class="col-lg-6 col-md-12 mb-4">
          <div class="card shadow-sm border-0">
            <div class="card-header text-white" style="background-color:#003366;">
              <h5 class="mb-0"><i class="bi bi-envelope-open me-2"></i>Detalle del Mensaje</h5>
            </div>

            <div class="card-body" id="message-details" style="min-height: 300px;">
              <p class="text-muted">Selecciona un mensaje para ver los detalles.</p>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/api.js"></script>

  <!-- JS DE ESTA PÁGINA -->
  <script src="../js/pages/mensajes.js"></script>

</body>
</html>
