<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin - MarAzul</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <!-- Font Awesome (si lo estás usando en el resto) -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    rel="stylesheet"
  />

  <!-- CSS Custom -->
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <!-- HEADER DINÁMICO -->
  <div id="header-container"></div>

  <!-- CARRITO DINÁMICO (lo dejamos porque tú lo usas para pruebas) -->
  <div id="carrito-container"></div>

  <!-- CONTENIDO PRINCIPAL -->
  <main
    class="py-5"
    style="background-color: #f8f9fa; min-height: calc(100vh - 80px);"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-11 col-xl-10">

          <!-- Card Principal -->
          <div class="card shadow border-0">

            <!-- Header de la Card -->
            <div
              class="card-header text-white py-3 d-flex justify-content-between align-items-center"
              style="background-color: #003366;"
            >
              <div class="d-flex align-items-center gap-2">
                <i class="bi bi-speedometer2 fs-4"></i>
                <h2 class="mb-0 fs-4">Panel de Administración</h2>
              </div>
              <span class="badge bg-light text-dark">
                Modo admin
              </span>
            </div>

            <!-- Body -->
            <div class="card-body p-3 p-md-4">

              <!-- Tabs -->
              <ul class="nav nav-tabs mb-3" id="adminTab" role="tablist">
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link active"
                    id="products-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#products-pane"
                    type="button"
                    role="tab"
                    aria-controls="products-pane"
                    aria-selected="true"
                  >
                    <i class="bi bi-box-seam me-1"></i> Productos
                  </button>
                </li>
                <li class="nav-item" role="presentation">
                  <button
                    class="nav-link"
                    id="categories-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#categories-pane"
                    type="button"
                    role="tab"
                    aria-controls="categories-pane"
                    aria-selected="false"
                  >
                    <i class="bi bi-tags me-1"></i> Categorías
                  </button>
                </li>
              </ul>

              <div class="tab-content" id="adminTabContent">
                <!-- TAB PRODUCTOS -->
                <div
                  class="tab-pane fade show active"
                  id="products-pane"
                  role="tabpanel"
                  aria-labelledby="products-tab"
                  tabindex="0"
                >
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                      <i class="bi bi-box-seam me-1"></i> Gestión de productos
                    </h5>
                    <button
                      class="btn btn-sm btn-success"
                      id="btn-new-product"
                    >
                      <i class="bi bi-plus-circle me-1"></i> Nuevo producto
                    </button>
                  </div>

                  <div id="products-alert" class="mb-2"></div>

                  <div class="table-responsive">
                    <table class="table table-sm align-middle">
                      <thead class="table-light">
                        <tr>
                          <th>Nombre</th>
                          <th>Categoría</th>
                          <th class="text-end">Precio</th>
                          <th class="text-center">Stock</th>
                          <th class="text-center">Estado</th>
                          <th class="text-end">Acciones</th>
                        </tr>
                      </thead>
                      <tbody id="products-tbody">
                        <!-- filas dinámicas -->
                      </tbody>
                    </table>
                  </div>
                </div>

                <!-- TAB CATEGORÍAS -->
                <div
                  class="tab-pane fade"
                  id="categories-pane"
                  role="tabpanel"
                  aria-labelledby="categories-tab"
                  tabindex="0"
                >
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">
                      <i class="bi bi-tags me-1"></i> Gestión de categorías
                    </h5>
                    <button
                      class="btn btn-sm btn-success"
                      id="btn-new-category"
                    >
                      <i class="bi bi-plus-circle me-1"></i> Nueva categoría
                    </button>
                  </div>

                  <div id="categories-alert" class="mb-2"></div>

                  <div class="table-responsive">
                    <table class="table table-sm align-middle">
                      <thead class="table-light">
                        <tr>
                          <th>Nombre</th>
                          <th>Descripción</th>
                       
                          <th class="text-end">Acciones</th>
                        </tr>
                      </thead>
                      <tbody id="categories-tbody">
                        <!-- filas dinámicas -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

 <!-- MODAL PRODUCTO COMPLETO -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <form id="product-form">

        <!-- HEADER -->
        <div class="modal-header" style="background-color:#003366; color:white;">
          <h5 class="modal-title" id="productModalLabel">Producto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <!-- BODY -->
        <div class="modal-body">
          <input type="hidden" id="product-id">

          <div class="row g-3">

            <!-- NOMBRE -->
            <div class="col-md-6">
              <label class="form-label">Nombre</label>
              <input type="text" id="product-name" class="form-control" required>
            </div>

            <!-- PRECIO -->
            <div class="col-md-3">
              <label class="form-label">Precio</label>
              <input type="number" min="0" id="product-price" class="form-control no-letters" required>
            </div>

            <!-- STOCK -->
            <div class="col-md-3">
              <label class="form-label">Stock</label>
              <input type="number" min="0" id="product-stock" class="form-control no-letters" required>
            </div>

            <!-- CATEGORÍA -->
            <div class="col-md-6">
              <label class="form-label">Categoría</label>
              <select id="product-category" class="form-select"></select>
            </div>

            <!-- DESTACADO SWITCH -->
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="product-featured">
                <label class="form-check-label" for="product-featured">Destacado</label>
              </div>
            </div>

            <!-- URL IMAGEN PRINCIPAL -->
            <div class="col-12">
              <label class="form-label">URL Imagen principal</label>
              <input type="text" id="product-mainImage" class="form-control" placeholder="https://...">
              <small class="text-muted">Debe ser un enlace directo a la imagen</small>
            </div>

            <!-- PREVIEW -->
            <div class="col-12 d-flex justify-content-center mt-2">
              <img 
                id="preview-mainImage"
                src=""
                alt="Vista previa"
                class="rounded shadow-sm d-none"
                style="max-width: 250px; max-height: 250px; object-fit: cover;">
            </div>

            <!-- DESCRIPCIÓN CORTA -->
            <div class="col-12">
              <label class="form-label">Descripción corta</label>
              <textarea id="product-short-description" rows="2" class="form-control"></textarea>
            </div>

            <!-- DESCRIPCIÓN DETALLADA -->
            <div class="col-12">
              <label class="form-label">Descripción detallada</label>
              <textarea id="product-long-description" rows="4" class="form-control"></textarea>
            </div>

          </div>
        </div>

        <!-- FOOTER -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="product-save-btn">Guardar cambios</button>
        </div>

      </form>
    </div>
  </div>
</div>



  <!-- MODAL CATEGORÍA -->
  <div
    class="modal fade"
    id="categoryModal"
    tabindex="-1"
    aria-labelledby="categoryModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content">
        <form id="category-form">
          <div class="modal-header" style="background-color:#003366; color:white;">
            <h5 class="modal-title" id="categoryModalLabel">Categoría</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="category-id" />

            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input
                type="text"
                id="category-name"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Descripción (opcional)</label>
              <textarea
                id="category-description"
                rows="3"
                class="form-control"
              ></textarea>
            </div>

            
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary" id="category-save-btn">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts del proyecto (mismo orden que contacto/órdenes) -->
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/api.js"></script>

  <!-- Script específico de esta página -->
  <script src="../js/pages/dashboard.js"></script>
</body>
</html>
