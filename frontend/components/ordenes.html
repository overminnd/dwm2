<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes Pendientes - MarAzul</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- HEADER -->
<div id="header-container"></div>

<!-- CARRITO -->
<div id="carrito-container"></div>

<!-- CONTENIDO -->
<main class="py-5" style="background-color: #f8f9fa; min-height: calc(100vh - 80px);">
  <div class="container">
    
    <div class="row justify-content-center">
      <div class="col-lg-10 col-md-11">
        
        <div class="card shadow border-0">
          <div class="card-header text-white text-center py-4" style="background-color:#003366;">
            <h2 class="mb-0">
              <i class="bi bi-receipt-cutoff me-2"></i>
              Órdenes Pendientes
            </h2>
          </div>
          
          <div class="card-body p-4 p-md-5">
            
            <div id="orders-list">
              <p class="text-muted">Cargando órdenes...</p>
            </div>

            <hr class="my-4">

            <div id="order-details"></div>
          
          </div>
        </div>

      </div>
    </div>

  </div>
</main>

<!-- ===========================
     MODAL DETALLE DE ORDEN
=========================== -->
<<!-- Modal Detalle de Orden -->
<div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-primary shadow">
      <div class="modal-header" style="background:#003366;">
        <h5 class="modal-title text-white fw-bold" id="orderModalLabel">Detalle de Orden</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="orderModalBody">
        <!-- Aquí cargaremos dinámicamente todo el contenido -->
      </div>

      <div class="modal-footer">
      </div>
    </div>
  </div>
</div>


<!-- SCRIPTS GLOBALES -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/api.js"></script>

<!-- SCRIPT ESPECÍFICO DE ÓRDENES -->
<script src="../js/pages/ordenes.js"></script>

</body>
</html>
